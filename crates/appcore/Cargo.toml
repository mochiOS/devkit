[package]
name = "mochios-appcore"
description = "The application framework for mochiOS"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/mochiOS/devkit"

[lib]
name = "appcore"
crate-type = ["rlib", "staticlib", "cdylib"]

[features]
default = ["ui"]
ui = ["dep:viewkit"]

[dependencies]
mochios-fonts = { git = "https://github.com/mochiOS/fonts", rev = "233cb947ed6b10e175b0c6570611eb5605f112e1" }
mochios-filesystem-protocol = { git = "https://github.com/mochiOS/syscalls" }
mochios-keychain-protocol = { git = "https://github.com/mochiOS/syscalls" }
zeroize = { version = "1.8", features = ["alloc"] }
toml = "1.1.2"
viewkit = { version = "2.0.0", git = "https://github.com/mochiOS/viewkit", optional = true }
mochios-workspace-protocol = { git = "https://github.com/mochiOS/syscalls" }

[target.'cfg(target_os = "mochios")'.dependencies]
mochi-user-platform = { version = "0.1.0", git = "https://github.com/mochiOS/syscalls", default-features = false, features = ["std"] }
mochios-posix-client = { git = "https://github.com/mochiOS/syscalls", default-features = false, features = ["syscall-endpoint"] }
mochios-posix-protocol = { git = "https://github.com/mochiOS/syscalls" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("mochios"))'] }

[target.'cfg(any(target_os = "linux", target_os = "mochios"))'.dependencies]
libc = { git = "https://github.com/mochiOS/libc", package = "libc" }
