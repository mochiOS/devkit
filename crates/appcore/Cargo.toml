[package]
name = "mochios-appcore"
description = "The application framework for mochiOS"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/mochiOS/devkit"

[lib]
name = "appcore"
crate-type = ["rlib", "staticlib", "cdylib"]

[features]
default = ["ui"]
ui = ["dep:viewkit"]

[dependencies]
mochios-fonts = { path = "../../../../libraries/fonts" }
mochios-filesystem-protocol = { path = "../../../../user/crates/filesystem-protocol" }
mochios-keychain-protocol = { path = "../../../../user/crates/keychain-protocol" }
zeroize = { version = "1.8", features = ["alloc"] }
toml = "1.1.2"
viewkit = { version = "2.0.0", path = "../../../../libraries/viewkit", optional = true }
mochios-workspace-protocol = { path = "../../../../user/crates/workspace-protocol" }

[target.'cfg(target_os = "mochios")'.dependencies]
mochi-user-platform = { version = "0.1.0", path = "../../../../user/crates/platform", default-features = false, features = ["std"] }
mochios-posix-client = { path = "../../../../user/crates/posix-client", default-features = false, features = ["syscall-endpoint"] }
mochios-posix-protocol = { path = "../../../../user/crates/posix-protocol" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("mochios"))'] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
