[package]
name = "msign"
version = "0.1.0"
edition = "2021"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("mochios"))'] }

[features]
default = ["developer-ca"]
developer-ca = ["dep:reqwest"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1.6"
tar = { version = "0.4", default-features = false }
flate2 = "1"
mochios-file-publication = { path = "../file-publication" }
mochios-elf-signature = { git = "https://github.com/mochiOS/syscalls" }
mochios-package-manifest = { git = "https://github.com/mochiOS/syscalls" }
reqwest = { version = "0.13.4", features = ["blocking", "json", "rustls"], optional = true }
mochios-certificate = { git = "https://github.com/mochiOS/syscalls", rev = "af217f5ca6a585110aabac813eb46dff8ccb7bfc", package = "mochios-certificate" }
mochios-signature-protocol = { git = "https://github.com/mochiOS/syscalls" }

[target.'cfg(target_os = "mochios")'.dependencies]
getrandom02 = { package = "getrandom", version = "0.2", features = ["custom"] }
mochios-posix-client = { git = "https://github.com/mochiOS/syscalls", default-features = false, features = ["getrandom02"] }

[dev-dependencies]
tempfile = "3"
