[package]
name = "komeup"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "1.1.2"
dirs = "6.0.0"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "rustls"] }
flate2 = "1.1.9"
tar = "0.4.46"
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
